[package]
name = "kacent-center"
version = "0.1.0"
description = "本地服务与独立终端管理中心"
edition = "2021"

[lib]
name = "kacent_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
sysinfo = "0.37"
netstat2 = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
which = "8"
open = "5"
tempfile = "3"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
cpal = "0.15.3"
whisper-rs = "0.16.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
sha1 = "0.10.6"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "block2", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSAutoreleasePool", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Services", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
